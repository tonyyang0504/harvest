name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
  wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Build wheel and sdist
        run: python -m pip install -q build && python -m build -o dist
      - name: Installed-wheel MCP stdio smoke
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/harvest templates > /dev/null
          /tmp/v/bin/harvest-ai templates > /dev/null
          /tmp/v/bin/python -c "import harvest_ai, importlib.metadata as m; assert m.version('harvest-ai') == harvest_ai.__version__"
          /tmp/v/bin/python tools/smoke_stdio.py /tmp/v/bin/harvest-mcp
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: harvest, POSTGRES_PASSWORD: harvest, POSTGRES_DB: harvest }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harvest" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install -q -e ".[dev,postgres]"
      - name: Tests against Postgres
        env: { HARVEST_TEST_PG_DSN: "postgresql://harvest:harvest@localhost:5432/harvest" }
        run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install with Playwright
        run: python -m pip install -q -e ".[dev,browser]" && python -m playwright install --with-deps chromium
      - name: Browser-lane tests (real headless Chromium)
        run: python -m pytest -q tests/test_browser_lane.py -rs
  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install with Playwright
        run: python -m pip install -q -e ".[dev,browser]" && python -m playwright install --with-deps chromium
      - name: Web UI end-to-end (harvest web + real headless Chromium)
        env: { HUIE2E_REQUIRE: "1", HUIE2E_SHOTS: ui-e2e-shots }
        run: python -m pytest -q tests/test_ui_e2e.py -rs
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ui-e2e-screenshots, path: ui-e2e-shots/, if-no-files-found: ignore }
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install with bubblewrap
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # ephemeral runner: lift Ubuntu's AppArmor user-namespace restriction (production: deploy/apparmor/bwrap)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python -m pip install -q -e ".[dev]"
      - name: Whole suite with every module under bubblewrap (unprivileged)
        env: { HARVEST_SANDBOX: bwrap }
        run: python -m pytest -q -rs
